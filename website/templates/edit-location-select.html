{%extends "base.html" %} {%block title %}Edit Location - Medical Appointment Manager{% endblock %}

{% block content %}

     <h1>Edit Location</h1>
     <form method="post">
        <div class="aligned-form">
            <div class="form-row-height-label">
                <label for="appointment-purpose-select">Select location to edit:</label>
            </div>
            <div class="form-row-height">
                <select onchange="redirectToPage(this.value)" id="appointment-purpose-select">
                        <option value="">--Select Location--</option>
                    {% for location in locations %}
                        <option value="{{url_for('views.edit_location', location_id=location.id)}}">{{ location.address_row_1 }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <script>
            function redirectToPage(url) {
                if (url) {
                    window.location.href = url;
                }
            }
        </script>
     </form>
{% endblock %}
