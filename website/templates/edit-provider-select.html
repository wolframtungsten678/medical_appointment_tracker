{%extends "base.html" %} {%block title %}Edit Provider - Medical Appointment Manager{% endblock %}

{% block content %}

     <h1>Edit Provider</h1>
     <form method="post">
        <div class="aligned-form">
            <div class="form-row-height-label">
                <label for="provider-select">Select provider to edit:</label>
            </div>
            <div class="form-row-height">
                <select onchange="redirectToPage(this.value)" id="provider-select">
                        <option value="">--Select Provider--</option>
                    {% for provider in providers %}
                        <option value="{{url_for('views.edit_provider', provider_id=provider.id)}}">{{ provider.first_name }} {{ provider.last_name}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <script>
            function redirectToPage(url) {
                if (url) {
                    window.location.href = url;
                }
            }
        </script>
     </form>
{% endblock %}
