{%extends "base.html" %} {%block title %}Edit Location - Medical Appointment Manager{% endblock %}

{% block content %}
    <h1>Edit Location</h1>
    <form method="post">
        <div class="aligned-form">
            <div class="form-row-height-label">
                <label for="practice-name">Practice Name</label>
            </div>
            <div class="form-row-height">
                <input type="text" id="practice-name" name="practice-name" value="{{location.practice_name}}">
            </div>

            <div class="form-row-height-label">
                <label for="address-row-1">Address Row 1 *</label>
            </div>
            <div class="form-row-height">
                <input type="text" id="address-row-1" name="address-row-1" value="{{location.address_row_1}}" required>
            </div>

            <div class="form-row-height-label">
                <label for="address-row-2">Address Row 2</label>
            </div>
            <div class="form-row-height">
                <input type="text" id="address-row-2" name="address-row-2" value="{{location.address_row_2}}">
            </div>

            <div class="form-row-height-label">
                <label for="city">City *</label>
            </div>
            <div class="form-row-height">
                <input type="text" id="city" name="city" value="{{location.city}}" required>
            </div>

            <div class="form-row-height-label">
                <label for="state">State *</label>
            </div>
            <div class="form-row-height">
                <select id="state" name="state" required>
                    <option value=""{% if not location.state %}selected{% endif %}>--Select State--</option>
                    <option value="alabama"{% if location.state=="alabama" %}selected{% endif %}>Alabama</option>
                    <option value="alaska"{% if location.state=="alaska" %}selected{% endif %}>Alaska</option>
                    <option value="arizona"{% if location.state=="arizona" %}selected{% endif %}>Arizona</option>
                    <option value="arkansas"{% if location.state=="arkansas" %}selected{% endif %}>Arkansas</option>
                    <option value="california"{% if location.state=="california" %}selected{% endif %}>California</option>
                    <option value="colorado"{% if location.state=="colorado" %}selected{% endif %}>Colorado</option>
                    <option value="connecticut"{% if location.state=="connecticut" %}selected{% endif %}>Connecticut</option>
                    <option value="delaware"{% if location.state=="delaware" %}selected{% endif %}>Delaware</option>
                    <option value="florida"{% if location.state=="florida" %}selected{% endif %}>Florida</option>
                    <option value="georgia"{% if location.state=="georgia" %}selected{% endif %}>Georgia</option>
                    <option value="hawaii"{% if location.state=="hawaii" %}selected{% endif %}>Hawaii</option>
                    <option value="idaho"{% if location.state=="idaho" %}selected{% endif %}>Idaho</option>
                    <option value="illinois"{% if location.state=="illinois" %}selected{% endif %}>Illinois</option>
                    <option value="indiana"{% if location.state=="indiana" %}selected{% endif %}>Indiana</option>
                    <option value="iowa"{% if location.state=="iowa" %}selected{% endif %}>Iowa</option>
                    <option value="kansas"{% if location.state=="kansas" %}selected{% endif %}>Kansas</option>
                    <option value="kentucky"{% if location.state=="kentucky" %}selected{% endif %}>Kentucky</option>
                    <option value="louisiana"{% if location.state=="louisiana" %}selected{% endif %}>Louisiana</option>
                    <option value="maine"{% if location.state=="maine" %}selected{% endif %}>Maine</option>
                    <option value="maryland"{% if location.state=="maryland" %}selected{% endif %}>Maryland</option>
                    <option value="massachusetts"{% if location.state=="massachusetts" %}selected{% endif %}>Massachusetts</option>
                    <option value="michigan"{% if location.state=="michigan" %}selected{% endif %}>Michigan</option>
                    <option value="minnesota"{% if location.state=="minnesota" %}selected{% endif %}>Minnesota</option>
                    <option value="mississippi"{% if location.state=="mississippi" %}selected{% endif %}>Mississippi</option>
                    <option value="missouri"{% if location.state=="missouri" %}selected{% endif %}>Missouri</option>
                    <option value="montana"{% if location.state=="montana" %}selected{% endif %}>Montana</option>
                    <option value="nebraska"{% if location.state=="nebraska" %}selected{% endif %}>Nebraska</option>
                    <option value="nevada"{% if location.state=="nevada" %}selected{% endif %}>Nevada</option>
                    <option value="new-hampshire"{% if location.state=="new-hampshire" %}selected{% endif %}>New Hampshire</option>
                    <option value="new-jersey"{% if location.state=="new-jersey" %}selected{% endif %}>New Jersey</option>
                    <option value="new-mexico"{% if location.state=="new-mexico" %}selected{% endif %}>New Mexico</option>
                    <option value="new-york"{% if location.state=="new-york" %}selected{% endif %}>New York</option>
                    <option value="north-carolina"{% if location.state=="north-carolina" %}selected{% endif %}>North Carolina</option>
                    <option value="north-dakota"{% if location.state=="north-dakota" %}selected{% endif %}>North Dakota</option>
                    <option value="ohio"{% if location.state=="ohio" %}selected{% endif %}>Ohio</option>
                    <option value="oklahoma"{% if location.state=="oklahoma" %}selected{% endif %}>Oklahoma</option>
                    <option value="oregon"{% if location.state=="oregon" %}selected{% endif %}>Oregon</option>
                    <option value="pennsylvania"{% if location.state=="pennsylvania" %}selected{% endif %}>Pennsylvania</option>
                    <option value="rhode-island"{% if location.state=="rhode-island" %}selected{% endif %}>Rhode Island</option>
                    <option value="south-carolina"{% if location.state=="south-carolina" %}selected{% endif %}>South Carolina</option>
                    <option value="south-dakota"{% if location.state=="south-dakota" %}selected{% endif %}>South Dakota</option>
                    <option value="tennessee"{% if location.state=="tennessee" %}selected{% endif %}>Tennessee</option>
                    <option value="texas"{% if location.state=="texas" %}selected{% endif %}>Texas</option>
                    <option value="utah"{% if location.state=="utah" %}selected{% endif %}>Utah</option>
                    <option value="vermont"{% if location.state=="vermont" %}selected{% endif %}>Vermont</option>
                    <option value="virginia"{% if location.state=="virginia" %}selected{% endif %}>Virginia</option>
                    <option value="washington"{% if location.state=="washington" %}selected{% endif %}>Washington</option>
                    <option value="west-virginia"{% if location.state=="west-virginia" %}selected{% endif %}>West Virginia</option>
                    <option value="wisconsin"{% if location.state=="wisconsin" %}selected{% endif %}>Wisconsin</option>
                    <option value="wyoming"{% if location.state=="wyoming" %}selected{% endif %}>Wyoming</option>
                </select>
            </div>

            <div class="form-row-height-label">
                <label for="zip-code">Zip Code *</label>
            </div>
            <div class="form-row-height">
                <input type="text" pattern="\d{5}(-\d{4})?" id="zip-code" name="zip-code" value="{{location.zip_code}}" inputmode="numeric" required>
            </div>

            <div class="form-row-height-label">
                <label for="travel-home">Travel time from home (min)</label>
            </div>
            <div class="form-row-height">
                <input type="number" id="travel-home" name="travel-home" value="{{location.travel_from_home}}">
            </div>

            <div class="form-row-height-label">
                <label for="travel-work">Travel time from work (min)</label>
            </div>
            <div class="form-row-height">
                <input type="number" id="travel-work" name="travel-work" value="{{location.travel_from_work}}">
            </div>

        </div>
        <p class="button">
            <button type="submit">Update location</button>
        </p>
    </form>
{% endblock %}
