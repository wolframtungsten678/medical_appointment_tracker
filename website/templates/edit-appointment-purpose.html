{%extends "base.html" %} {%block title %}Edit Appointment Purpose - Medical Appointment Manager{% endblock %}

{% block content %}

     <h1>Edit Appointment Purpose</h1>
     <form method="post">
          <div class="aligned-form">
               <div class="form-row-height-label">
                    <label for="visit-purpose">Visit purpose description *</label>
               </div>
               <div class="form-row-height">
                    <input type="text" id="visit-purpose" name="visit-purpose" value = "{{purpose.visit_purpose}}">
               </div>

               <div class="form-row-height-label">
                    <label for="appointment-frequency">Appointment Frequency *</label>
               </div>
               <div class="form-row-height">
                    <select name="appointment-frequency" id="appointment-frequency">
                         <option value=""{% if not purpose.appointment_frequency %}selected{% endif %}>--Select Frequency--</option>
                         <option value="three-per-week" {% if purpose.appointment_frequency=="three-per-week" %}selected{% endif %}>3x Weekly</option>
                         <option value="two-per-week" {% if purpose.appointment_frequency=="two-per-week" %}selected{% endif %}>2x Weekly</option>
                         <option value="weekly" {% if purpose.appointment_frequency=="weekly" %}selected{% endif %}>Weekly</option>
                         <option value="biweekly" {% if purpose.appointment_frequency=="biweekly" %}selected{% endif %}>Every 2 Weeks</option>
                         <option value="monthly" {% if purpose.appointment_frequency=="monthly" %}selected{% endif %}>Monthly</option>
                         <option value="every-two-months" {% if purpose.appointment_frequency=="every-two-months" %}selected{% endif %}>Every 2 Months</option>
                         <option value="quarterly" {% if purpose.appointment_frequency=="quarterly" %}selected{% endif %}>Quarterly</option>
                         <option value="six-months" {% if purpose.appointment_frequency=="six-months" %}selected{% endif %}>Every 6 Months</option>
                         <option value="yearly" {% if purpose.appointment_frequency=="yearly" %}selected{% endif %}>Annual</option>
                         <option value="appt-freq-other" {% if purpose.appointment_frequency=="appt-freq-other" %}selected{% endif %}>Other</option>
                    </select>
               </div>

               <div class="form-row-height-label">
                    <label for="appt-reminder-needed">Appointment reminder needed? *</label>
               </div>
               <div class="form-row-height">
                    <input type="checkbox" name="appt-reminder-needed" id="appt-reminder-needed">
               </div>
               
               <div class="form-row-height-label">
                    <label for="sched-lead-time">Scheduling Lead Time (weeks)</label>
               </div>   
               <div class="form-row-height">
                    <input type="number" id="sched-lead-time" name="sched-lead-time" placeholder="e.g. 6" value="{{purpose.scheduling_lead_time}}">
               </div>

               <div class="form-row-height-label">
                    <label for="visit-duration">Typical visit duration (min)</label>
               </div>
               <div class="form-row-height">
                    <input type="number" id="visit-duration" name="visit-duration" placeholder="e.g. 30" value="{{purpose.visit_duration}}">
               </div>

          </div>
          <p class="button">
               <button type="submit" class="medium-button">Update appointment purpose</button>
          </p>

     </form>
{% endblock %}
